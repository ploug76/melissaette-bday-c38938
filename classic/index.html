function MELS(s){return S(s.trim().split(/\s+/).map(t=>{const [n,d]=t.split(':');return [n=='r'?0:nm(n),+(d||2)]}))}

function playing(){return state=='play'&&!paused&&!panelOpen}
function kc(code){return function(p){if(state=='parade'||state=='cake'){if(p){GamepadSupport.key('Enter',true);GamepadSupport.key('Enter',false)}return}if(!playing()&&p)return;GamepadSupport.key(code,p)}}
GamepadSupport.init({
 keys:{left:'ArrowLeft',right:'ArrowRight',up:'ArrowUp',down:'ArrowDown',a:kc('Space'),b:kc('KeyX'),x:kc('KeyX'),rt:kc('KeyX'),
  start:function(p){if(p&&state=='play'&&!panelOpen)togglePause()},
  back:function(p){if(p)setMute(!muted)}},
 noRepeat:['start','back'],repeat:false,
 ignoreSel:'#dock,#mute,#pause,#inst,#ios,.tb,#dockHint',
 menu:function(){return ov()||panelOpen||paused||!(state=='play'||state=='parade')},
 items:GamepadSupport.list(function(){if(ov()||panelOpen)return [];return menuBtns.slice()},{scale:1}),
 isPaused:function(){return state=='play'&&paused},
 pause:function(){if(state=='play'&&!paused)togglePause()},
 back:function(){if(ov())return false;
  if(panelOpen){var c=document.getElementById('pclose');if(c)c.click();return true}
  if(state=='play'&&paused){togglePause();return true}
  return true;},
 hint:{text:'🎮 Controller: stick/D-pad walk · A jump · B or X run · Start pause',when:function(){return state=='title'&&!ov()&&!panelOpen}}
});
})();
</script>
<!-- gamepad:end -->
</body></html>
